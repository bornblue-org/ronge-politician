spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ronge}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:Tushar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB

server:
  port: ${PORT:8080}

ronge:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:RongeAdmin@2026}
  jwt-secret: ${JWT_SECRET:ronge-dev-jwt-secret-change-before-deploy-32}
  upload-dir: ${UPLOAD_DIR:uploads}
